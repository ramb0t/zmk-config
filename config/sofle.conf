# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP removed: auto-enabled since ZMK Zephyr 4.1 migration

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# disable "Underglow toggling also controls external power" so that OLED can still run with RGB off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Underglow off at boot and whenever the keyboard goes idle.
# Note: EXT_POWER=n above means "off" sends black rather than cutting the
# VCC rail, so the WS2812s keep drawing standby current either way.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Enable Mouse functions:
#CONFIG_ZMK_POINTING=y

# Rename the BT device
CONFIG_ZMK_KEYBOARD_NAME="Sofle Choc BLE"

# nice_epaper (zmk-nice-oled) widgets: bongo cat instead of Luna
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
