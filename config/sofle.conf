# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP removed: auto-enabled since ZMK Zephyr 4.1 migration

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# disable "Underglow toggling also controls external power" so that OLED can still run with RGB off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Underglow on at boot, off whenever the keyboard goes idle.
# ON_START=y is a probe: the right half's LEDs never light, and lighting
# them at boot needs no relayed behaviour, so it separates a dead strip or
# an unpowered rail from a toggle that is not reaching the peripheral.
# Note: EXT_POWER=n above means "off" sends black rather than cutting the
# VCC rail, so the WS2812s keep drawing standby current either way.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Enable Mouse functions:
#CONFIG_ZMK_POINTING=y

# Rename the BT device
CONFIG_ZMK_KEYBOARD_NAME="Sofle Choc BLE"

# nice_epaper (zmk-nice-oled) widgets: bongo cat instead of Luna
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n

# Restore the two values zmk-nice-oled asks for but never gets: ZMK and the
# LVGL Zephyr module both declare an unconditional default for these, parsed
# first, so the module's own defaults in Kconfig.defconfig never apply.
# Module intends 100 (Kconfig.defconfig:25) and 4096 (:61, :258).
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
