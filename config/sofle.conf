# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP removed: auto-enabled since ZMK Zephyr 4.1 migration

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# disable "Underglow toggling also controls external power" so that OLED can still run with RGB off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Underglow off at boot. Note this is only a seed: settings_load() runs after
# zmk_rgb_underglow_init() and rgb_settings_set() overwrites the whole state
# struct (rgb_underglow.c:213-224), so the real boot state is whatever was last
# saved to NVS on that half.
#
# AUTO_OFF_IDLE is deliberately NOT set. On a split it latches the peripheral
# off: the right half's idle clock counts only its own key presses, and the
# auto-off path saves through to NVS (rgb_underglow.c:348), so a transient idle
# turns into the stored boot state. The wake path only restores the strip if it
# was on when the half went idle, which after the first cycle it never is.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Enable Mouse functions:
#CONFIG_ZMK_POINTING=y

# Rename the BT device
CONFIG_ZMK_KEYBOARD_NAME="Sofle Choc BLE"

# nice_epaper (zmk-nice-oled) widgets: bongo cat instead of Luna
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n

# Restore the two values zmk-nice-oled asks for but never gets: ZMK and the
# LVGL Zephyr module both declare an unconditional default for these, parsed
# first, so the module's own defaults in Kconfig.defconfig never apply.
# Module intends 100 (Kconfig.defconfig:25) and 4096 (:61, :258).
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# PROBE ONLY -- remove after diagnosing the right half's dark underglow.
# USB CDC console on both halves so the peripheral can be read directly:
# looking for the led_strip device failing to init, or
# "Failed to update the RGB strip" from rgb_underglow.c:195.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
